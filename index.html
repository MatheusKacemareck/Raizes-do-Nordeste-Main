<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raízes do Nordeste</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css">
</head>

<body>

<header>
    <div class="logo">
        <div>
            <h2>Raízes do Nordeste</h2>
            <span>Sabores da nossa terra</span>
        </div>
    </div>
</header>

<section class="categorias">
    <button>Tapiocas</button>
    <button>Cuscuz</button>
    <button>Bebidas</button>
    <button>Sobremesas</button>
</section>

<div id="unidadeSelecionada">
    Unidade
</div>

<main class="container">
    <div class="cards">

        <div class="card">
            <img src="https://picsum.photos/300/180?1" alt="Tapioca">

            <div class="info">
                <h3>Tapioca de Queijo</h3>
                <p>Massa artesanal com queijo coalho.</p>

                <div class="rodape-card">
                    <span>R$ 14,90</span>

                    <button type="button" onclick="adicionarCarrinho('Tapioca de Queijo',14.90)">
                        +
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/180?2" alt="Cuscuz">

            <div class="info">
                <h3>Cuscuz Completo</h3>
                <p>Cuscuz, carne de sol e queijo.</p>

                <div class="rodape-card">
                    <span>R$ 18,90</span>

                    <button type="button" onclick="adicionarCarrinho('Cuscuz Completo',18.90)">
                        +
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/180?3" alt="Café">

            <div class="info">
                <h3>Café Regional</h3>
                <p>Café especial nordestino.</p>

                <div class="rodape-card">
                    <span>R$ 6,00</span>

                    <button type="button" onclick="adicionarCarrinho('Café Regional',6)">
                        +
                    </button>
                </div>
            </div>
        </div>

    </div>
</main>

<div class="carrinho" onclick="abrirCarrinho()">
    🛒 <span id="itens-carrinho">0</span>
</div>

</body>
</html>
