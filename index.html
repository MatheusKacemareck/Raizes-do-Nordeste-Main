<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raízes do Nordeste</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Correções locais: cabeçalho, conta e centralização do menu */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .acoes-conta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .botao-conta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .botao-conta:hover,
        .botao-conta:focus-visible {
            background: rgba(255, 255, 255, 0.14);
        }

        .botao-sair {
            display: none;
        }

        /* Menu inferior com quatro áreas exatamente iguais */
        .menu-inferior {
            position: fixed !important;
            top: auto !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 65px;
            margin: 0 !important;
            padding: 0 !important;
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: stretch;
            justify-content: initial !important;
            background:#6A3305;
            border-top:2px solid #512503;
            z-index: 1000;
        }

        .menu-inferior a {
            width: 100% !important;
            min-width: 0;
            height: 100%;
            margin: 0 !important;
            padding: 6px 0 !important;
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-sizing: border-box;
            text-align: center;
            line-height: 1;
            color:#F8E7C7;
            text-decoration: none;
        }

        .menu-inferior a i {
            font-size: 25px;
            line-height: 1;
        }

        .menu-inferior a span {
            font-size: 13px;
            line-height: 1.1;
        }

        .menu-inferior a:hover,
        .menu-inferior a:focus-visible,
        .menu-inferior a.ativo {
            color:#F5C451;
            background:#7F4112;
        }

        /* Evita que o menu cubra o final do conteúdo */
        body {
            padding-bottom: 75px;
        }


        /* Mantém o carrinho flutuante totalmente acima do menu inferior */
        .carrinho {
            position: fixed !important;
            right: 20px !important;
            bottom: 85px !important;
            top: auto !important;
            z-index: 1100 !important;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #F5A623;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(0,0,0,.18);
            border: none;
        }

        .carrinho i{
            color:#fff;
        }

        .carrinho #itens-carrinho{
            position:absolute;
            top:-4px;
            right:-4px;
            width:24px;
            height:24px;
            border-radius:50%;
            background:#e60012;
            color:#fff;
            font-size:12px;
            font-weight:700;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* Ajuste para telas pequenas, respeitando a área segura do celular */
        @media (max-width: 600px) {
            .carrinho {
                right: 16px !important;
                bottom: calc(80px + env(safe-area-inset-bottom, 0px)) !important;
            }
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
            }

            .acoes-conta {
                gap: 6px;
            }

            .botao-conta {
                min-height: 36px;
                padding: 7px 9px;
                font-size: 0.85rem;
            }

            .texto-conta {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <div>
            <h2>Raízes do Nordeste</h2>
            <span>Sabores da nossa terra</span>
        </div>
    </div>

    <div class="acoes-conta" aria-label="Acesso do usuário">
        <a id="botaoEntrar" class="botao-conta" href="login.html">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            <span class="texto-conta">Entrar</span>
        </a>

        <a id="botaoConta" class="botao-conta" href="perfil.html">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span class="texto-conta">Conta</span>
        </a>

        <button id="botaoSair" class="botao-conta botao-sair" type="button">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            <span class="texto-conta">Sair</span>
        </button>
    </div>
</header>

<section class="categorias">
    <button>Tapiocas</button>
    <button>Cuscuz</button>
    <button>Bebidas</button>
    <button>Sobremesas</button>
</section>

<div id="unidadeSelecionada">Unidade</div>

<main class="container">
    <div class="cards">

        <div class="card">
            <img src="https://picsum.photos/300/180?1" alt="Tapioca">
            <div class="info">
                <h3>Tapioca de Queijo</h3>
                <p>Massa artesanal com queijo coalho.</p>
                <div class="rodape-card">
                    <span>R$ 14,90</span>
                    <button type="button" onclick="adicionarCarrinho('Tapioca de Queijo',14.90)">+</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/180?2" alt="Cuscuz">
            <div class="info">
                <h3>Cuscuz Completo</h3>
                <p>Cuscuz, carne de sol e queijo.</p>
                <div class="rodape-card">
                    <span>R$ 18,90</span>
                    <button type="button" onclick="adicionarCarrinho('Cuscuz Completo',18.90)">+</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/180?3" alt="Café">
            <div class="info">
                <h3>Café Regional</h3>
                <p>Café especial nordestino.</p>
                <div class="rodape-card">
                    <span>R$ 6,00</span>
                    <button type="button" onclick="adicionarCarrinho('Café Regional',6)">+</button>
                </div>
            </div>
        </div>

    </div>
</main>

<div class="carrinho" onclick="abrirCarrinho()">
    <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
    <span id="itens-carrinho">0</span>
</div>

<nav class="menu-inferior" aria-label="Navegação principal">
    <a href="index.html" class="ativo" aria-label="Início">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        <span>Início</span>
    </a>

    <a href="fidelidade.html" aria-label="Fidelidade">
        <i class="fa-solid fa-tag" aria-hidden="true"></i>
        <span>Fidelidade</span>
    </a>

    <a href="carrinho.html" aria-label="Carrinho">
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        <span>Carrinho</span>
    </a>

    <a href="perfil.html" aria-label="Conta">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span>Conta</span>
    </a>
</nav>

<script src="js/app.js"></script>
<script>
    function usuarioEstaLogado() {
        return localStorage.getItem('logado') === 'true' ||
               localStorage.getItem('usuarioLogado') === 'true' ||
               Boolean(localStorage.getItem('usuario'));
    }

    function atualizarBotoesConta() {
        const logado = usuarioEstaLogado();
        const botaoEntrar = document.getElementById('botaoEntrar');
        const botaoConta = document.getElementById('botaoConta');
        const botaoSair = document.getElementById('botaoSair');

        botaoEntrar.style.display = logado ? 'none' : 'inline-flex';
        botaoConta.style.display = 'inline-flex';
        botaoSair.style.display = logado ? 'inline-flex' : 'none';
    }

    document.getElementById('botaoSair').addEventListener('click', function () {
        localStorage.removeItem('logado');
        localStorage.removeItem('usuarioLogado');
        localStorage.removeItem('usuario');
        sessionStorage.clear();
        atualizarBotoesConta();
        window.location.href = 'index.html';
    });

    atualizarBotoesConta();
</script>

</body>
</html>
